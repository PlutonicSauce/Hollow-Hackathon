[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lifeline-engine"
version = "0.1.0"
description = "Deterministic functional infrastructure model for LIFELINE"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*"]
